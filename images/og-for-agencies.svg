<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="100%" stop-color="#0D1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CBF"/>
      <stop offset="100%" stop-color="#7C5CBF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circle top-right -->
  <circle cx="1100" cy="80" r="320" fill="#7C5CBF" opacity="0.06"/>
  <circle cx="1000" cy="200" r="180" fill="#7C5CBF" opacity="0.05"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- Logo mark -->
  <rect x="60" y="56" width="44" height="44" rx="10" fill="#7EC8E3"/>
  <line x1="82" y1="76" x2="82" y2="90" stroke="#1A1A18" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="74" y1="83" x2="90" y2="83" stroke="#1A1A18" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Logo wordmark -->
  <text x="114" y="87" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">trajekt</text>
  <!-- Tag pill -->
  <rect x="60" y="480" width="88" height="28" rx="14" fill="#7C5CBF" opacity="0.18"/><text x="72" y="498" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#7C5CBF" letter-spacing="0.06em">AGENCIES</text>
  <!-- Title -->
  <text x="60" y="260" font-family="system-ui,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Product Feed Management for</text><text x="60" y="324" font-family="system-ui,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Agencies</text>
  <!-- Subtitle -->
  <text x="60" y="408" font-family="system-ui,sans-serif" font-size="22" fill="rgba(255,255,255,0.55)">Multi-store management, client rule templates, all</text><text x="60" y="438" font-family="system-ui,sans-serif" font-size="22" fill="rgba(255,255,255,0.55)">channels from one platform. Agency pricing available.</text>
  <!-- Bottom URL -->
  <text x="60" y="590" font-family="system-ui,sans-serif" font-size="16" fill="rgba(255,255,255,0.55)" opacity="0.6">trajekt.co.uk</text>
